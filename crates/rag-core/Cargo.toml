[package]
name = "rag-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Pick exactly one ONNX Runtime flavour:
#  - `bundled`: ORT statically linked from prebuilt binaries (Linux/macOS, plain Windows builds)
#  - `winml`:   ORT loaded at runtime from the Windows ML package (onnxruntime.dll next to the exe),
#               with vendor execution providers downloaded/registered through Windows ML.
default = []
bundled = ["fastembed/ort-download-binaries-native-tls"]
cuda = ["bundled", "ort/cuda", "ort/copy-dylibs"]
winml = ["fastembed/ort-load-dynamic", "fastembed/directml", "ort/load-dynamic", "ort/directml", "ort/api-28", "dep:libloading"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true

dirs = "7"
ignore = "0.4"
blake3 = { version = "1", features = ["mmap"] }
futures = "0.3"
rayon = "1"
zstd = "0.13"

fastembed = { version = "7.7", default-features = false, features = ["hf-hub-native-tls"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }
libloading = { version = "0.9", optional = true }
# Same version/features fastembed uses; fetches the FP16 ONNX variants.
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }

# Arrow types come from lancedb::arrow so versions can never diverge.
lancedb = "0.41"

text-splitter = { version = "0.33", features = ["code"] }
tree-sitter = "0.27"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.24"
tree-sitter-python = "0.25"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
