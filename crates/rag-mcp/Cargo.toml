[package]
name = "rag-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless MCP (stdio) server exposing local semantic code search"


[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
schemars = "1"

# ONNX Runtime flavour per platform: Windows uses Windows ML (vendor EPs via the
# Windows ML catalog, DirectML fallback); elsewhere the bundled ORT with CUDA
# (falls back to CPU when CUDA/cuDNN are missing).
[target.'cfg(windows)'.dependencies]
rag-core = { workspace = true, features = ["winml"] }

[target.'cfg(not(windows))'.dependencies]
rag-core = { workspace = true, features = ["cuda"] }
