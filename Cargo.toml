[workspace]
resolver = "2"
members = ["crates/rag-core", "crates/rag-mcp", "crates/workspace-hack", "src-tauri"]
default-members = ["crates/rag-core", "crates/rag-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.94"  # lancedb 0.41 MSRV; std file locks need 1.89+

[workspace.dependencies]
rag-core = { path = "crates/rag-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Temporary: symbols in build scripts so tauri-build backtraces are readable.
[profile.release.build-override]
debug = true

[profile.dev]
debug = "line-tables-only"

# Heavy numeric deps are painfully slow in debug; optimise them even in dev.
[profile.dev.package."*"]
opt-level = 2
debug = false
