[package]
name = "local-code-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop manager for local semantic code indexes"

[lib]
name = "local_code_rag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# CUDA by default (NVIDIA). ONNX Runtime falls back to CPU if CUDA/cuDNN are missing.
# CPU-only: --no-default-features. Non-NVIDIA Windows GPUs: --no-default-features --features directml
default = ["cuda"]
cuda = ["rag-core/cuda"]
directml = ["rag-core/directml"]

[dependencies]
rag-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
