[package]
name = "local-code-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop manager for local semantic code indexes"

[lib]
name = "local_code_rag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }


[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
# In-app updates from GitHub Releases (signed). native-tls = OS certificate store.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
workspace-hack = { version = "0.1", path = "../crates/workspace-hack" }

# ONNX Runtime flavour per platform: Windows uses Windows ML (vendor EPs via the
# Windows ML catalog, DirectML fallback); elsewhere the bundled ORT with CUDA
# (falls back to CPU when CUDA/cuDNN are missing).
[target.'cfg(windows)'.dependencies]
rag-core = { workspace = true, features = ["winml"] }
# ShellExecuteW: open release links in the default browser without a shell.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
rag-core = { workspace = true, features = ["cuda"] }
