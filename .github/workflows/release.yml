name: Release

# Every push to main publishes a GitHub Release v<version>, where <version> is
# "version" in src-tauri/tauri.conf.json. Bump it on develop before merging.
# Tests are not repeated here: main only receives commits CI already tested on develop.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release half-way; queue a newer one behind it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ORT_CUDA_VERSION: "13"
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"version\" in src-tauri/tauri.conf.json on develop, then merge to main again."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  publish:
    name: build + publish (windows)
    needs: version
    runs-on: windows-latest
    # Signing key + updater public key live in this environment (see README "Updates").
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - name: check signing setup
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "Secret TAURI_SIGNING_PRIVATE_KEY is missing in the 'release' environment."; exit 1 }
          if (-not $env:UPDATER_PUBKEY) { Write-Error "Variable TAURI_UPDATER_PUBKEY is missing in the 'release' environment."; exit 1 }
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # protoc for lance's build scripts (arduino/setup-protoc still runs on deprecated Node 20).
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Release-only config: embed the updater public key and sign the installers.
      - name: build (signed)
        shell: pwsh
        run: |
          $cfg = @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBKEY } } }
          $cfg | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM release.conf.json
          npx tauri build --config release.conf.json
      # Assets with stable names (no spaces) + latest.json for the in-app updater.
      - name: collect assets
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $exeName = "LocalCodeRAG_${ver}_x64-setup.exe"
          Copy-Item $exe.FullName "dist/$exeName"
          Copy-Item "$($exe.FullName).sig" "dist/$exeName.sig"
          Copy-Item $msi.FullName "dist/LocalCodeRAG_${ver}_x64.msi"
          $entry = [ordered]@{
            signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$exeName"
          }
          $latest = [ordered]@{
            version = $ver
            notes = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = $entry; "windows-x86_64-nsis" = $entry }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
          # Stand-alone MCP server (for use without the app).
          New-Item -ItemType Directory -Force dist-mcp | Out-Null
          Copy-Item target/release/rag-mcp.exe dist-mcp/
          Copy-Item src-tauri/binaries/winml/*.dll dist-mcp/
          Compress-Archive -Path dist-mcp/* -DestinationPath "dist/rag-mcp-$tag-windows-x64.zip"
          Get-ChildItem dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Local Code RAG ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
