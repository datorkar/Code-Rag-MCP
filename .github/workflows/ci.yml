name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners have no CUDA toolkit to detect. ort 2.0.0-rc.15 only ships CUDA 13 binaries.
  ORT_CUDA_VERSION: "13"

jobs:
  core:
    name: rag-core + rag-mcp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ort: winml   # Windows ML (ORT 1.28 + DirectML + vendor EP catalog)
          - os: ubuntu-latest
            ort: bundled # static ORT + CUDA 13 EP
    runs-on: ${{ matrix.os }}
    env:
      LOCAL_CODE_RAG_WINML_DIR: ${{ github.workspace }}/src-tauri/binaries/winml
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - if: matrix.ort == 'winml'
        run: node scripts/fetch-winml.mjs
      - run: cargo test -p rag-core --features ${{ matrix.ort }} -p rag-mcp
      # Real embedding through Windows ML's ONNX Runtime (CPU + DirectML attempt), lists the EP catalog.
      - if: matrix.ort == 'winml'
        run: cargo test -p rag-core --features winml --test winml_smoke -- --ignored --nocapture
      - run: cargo build --release -p rag-mcp
      - uses: actions/upload-artifact@v7
        with:
          name: rag-mcp-${{ matrix.os }}
          path: |
            target/release/rag-mcp
            target/release/rag-mcp.exe

  desktop:
    name: Tauri app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: local-code-rag-windows
          path: target/release/bundle/**
