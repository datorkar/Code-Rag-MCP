name: CI

# main is built and published by release.yml.
on:
  push:
    branches: [develop, "claude/**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners have no CUDA toolkit to detect. ort 2.0.0-rc.15 only ships CUDA 13 binaries.
  ORT_CUDA_VERSION: "13"
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ort: winml   # Windows ML (ORT 1.28 + DirectML + vendor EP catalog)
          - os: ubuntu-latest
            ort: bundled # static ORT + CUDA 13 EP
    runs-on: ${{ matrix.os }}
    env:
      LOCAL_CODE_RAG_WINML_DIR: ${{ github.workspace }}/src-tauri/binaries/winml
      # Linux: per-crate compile cache (sccache, GitHub Actions cache).
      # Windows: sccache cannot handle Cargo's long rustc command lines
      # (os error 206), so the target dir is cached by rust-cache instead.
      SCCACHE_GHA_ENABLED: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
      RUSTC_WRAPPER: ${{ matrix.os == 'ubuntu-latest' && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # protoc for lance's build scripts (arduino/setup-protoc still runs on deprecated Node 20).
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: matrix.os == 'ubuntu-latest'
        uses: mozilla-actions/sccache-action@v0.0.11
      # Linux: registry only (compiled crates live in sccache). Windows: also target/.
      # One cache per OS, written only by develop (≈ one copy per build type in
      # the 10 GB repo budget); other branches and PRs restore without saving.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          cache-targets: ${{ matrix.os != 'ubuntu-latest' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The workspace-hack crate must match the dependency graph (see README).
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - if: matrix.os == 'ubuntu-latest'
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run
      - if: matrix.ort == 'winml'
        run: node scripts/fetch-winml.mjs
      - run: cargo test -p rag-core --features ${{ matrix.ort }} -p rag-mcp
      # Real embedding through Windows ML's ONNX Runtime (CPU + DirectML attempt), lists the EP catalog.
      - if: matrix.ort == 'winml'
        run: cargo test -p rag-core --features winml --test winml_smoke -- --ignored --nocapture
      - if: matrix.os == 'ubuntu-latest'
        run: sccache --show-stats

  desktop:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # protoc for lance's build scripts (arduino/setup-protoc still runs on deprecated Node 20).
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      # Windows: cache the compiled target dir (sccache fails on long rustc command lines).
      # Same key as release.yml: releases on main reuse develop's release-profile
      # build (requires develop to be the default branch, see DEVELOPERS.md).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Builds rag-mcp (sidecar) and the app into the same target dir, so the
      # shared dependency graph is compiled once.
      - run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: local-code-rag-windows-ml
          path: target/release/bundle/**
      - uses: actions/upload-artifact@v7
        with:
          name: rag-mcp-windows-ml
          path: |
            target/release/rag-mcp.exe
            src-tauri/binaries/winml/*.dll
