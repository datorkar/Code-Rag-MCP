name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners have no CUDA toolkit to detect. ort 2.0.0-rc.15 only ships CUDA 13 binaries.
  ORT_CUDA_VERSION: "13"
  # Per-crate compile cache in the GitHub Actions cache: unchanged crates are
  # reused across runs, branches and failed jobs.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ort: winml   # Windows ML (ORT 1.28 + DirectML + vendor EP catalog)
          - os: ubuntu-latest
            ort: bundled # static ORT + CUDA 13 EP
    runs-on: ${{ matrix.os }}
    env:
      LOCAL_CODE_RAG_WINML_DIR: ${{ github.workspace }}/src-tauri/binaries/winml
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Registry/git downloads only; compiled artifacts live in sccache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
      # The workspace-hack crate must match the dependency graph (see README).
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - if: matrix.os == 'ubuntu-latest'
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run
      - if: matrix.ort == 'winml'
        run: node scripts/fetch-winml.mjs
      - run: cargo test -p rag-core --features ${{ matrix.ort }} -p rag-mcp
      # Real embedding through Windows ML's ONNX Runtime (CPU + DirectML attempt), lists the EP catalog.
      - if: matrix.ort == 'winml'
        run: cargo test -p rag-core --features winml --test winml_smoke -- --ignored --nocapture
      - run: sccache --show-stats

  desktop:
    name: installer (windows)
    runs-on: windows-latest
    env:
      RUST_LIB_BACKTRACE: "1"   # temporary: backtrace for the tauri-build failure
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Builds rag-mcp (sidecar) and the app into the same target dir, so the
      # shared dependency graph is compiled once.
      - run: npx tauri build
      - run: sccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: local-code-rag-windows-ml
          path: target/release/bundle/**
      - uses: actions/upload-artifact@v7
        with:
          name: rag-mcp-windows-ml
          path: |
            target/release/rag-mcp.exe
            src-tauri/binaries/winml/*.dll
